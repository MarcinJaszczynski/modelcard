[project]
name = "modelarz"
version = "0.1.0"
description = "Projektowanie modeli kartonowych: bryła 3D -> rozwinięcia z zakładkami -> arkusze PDF 1:1"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.1",
    "reportlab>=4.2",
    "ddgs>=9.16.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
modelarz = "modelarz.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelarz"]
artifacts = ["src/modelarz/samoloty/*.json", "src/modelarz/sceny/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
